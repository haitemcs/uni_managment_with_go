services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: university_db
      POSTGRES_USER: university
      POSTGRES_PASSWORD: university
    ports:
      - "5433:5432"
    volumes:
      - university_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_analytics.sql:/docker-entrypoint-initdb.d/02_analytics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university -d university_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      APP_PORT: 8080
      DATABASE_URL: postgres://university:university@db:5432/university_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      JWT_TTL_HOURS: 24
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  university_data:
