name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Download dependencies
        run: go mod tidy
      - name: Run tests
        run: go test ./...
      - name: Build API
        run: go build ./cmd/api
